# User-tunable defaults (adjust to match your tank hardware/thresholds).
substitutions:
  # Level calibration defaults assume ~0.5-2.5 V span from a 0-180 ohm sender through the divider.
  default_fill_stop_level: "90.0"
  default_drain_stop_level: "10.0"
  default_drain_timeout_ms: "45000"
  default_freeze_threshold_c: "2.0"
  default_freeze_protection_enabled: "false"
  default_level_empty_volts: "0.5"
  default_level_full_volts: "2.5"
  default_safety_override: "false"
  firmware_version: "v0.1.0"
  cyd_udp_port: "60505"

esphome:
  name: smartrv-tankpro
  name_add_mac_suffix: true
  comment: "ESPHome production firmware for SmartRV TankPro (ESP32-C3, factory AP provisioning)."
  on_boot:
    - priority: -10
      then:
        - switch.turn_off: tank_valve_relay
        - globals.set:
            id: fill_in_progress
            value: 'false'
        - globals.set:
            id: drain_in_progress
            value: 'false'
        - globals.set:
            id: fill_above_stop_seen
            value: 'false'
        - globals.set:
            id: guard_over_stop_counter
            value: '0'
        - text_sensor.template.publish:
            id: fault_description
            state: "None"
        - text_sensor.template.publish:
            id: fault_code
            state: "0"
        - text_sensor.template.publish:
            id: firmware_version_text
            state: !lambda 'return id(firmware_version);'
    - priority: 50
      then:
        - lambda: |-
            if (id(paired_to_cyd)) {
              WiFi.softAPdisconnect(true);
              WiFi.enableAP(false);
              WiFi.mode(WIFI_STA);
              ESP_LOGI("wifi", "Paired to CYD; skipping fallback AP.");
            } else {
              std::string mac = WiFi.macAddress().c_str();
              std::string compact;
              compact.reserve(mac.size());
              for (char c : mac) {
                if (c != ':') compact.push_back(c);
              }
              std::string suffix = compact.size() >= 4 ? compact.substr(compact.size() - 4) : compact;
              std::string ssid = std::string("TankPro-") + suffix + "-Setup";
              WiFi.softAPdisconnect(true);
              WiFi.enableAP(false);
              WiFi.mode(WIFI_AP_STA);
              WiFi.softAP(ssid.c_str(), "changeme");
              ESP_LOGI("wifi", "Fallback AP active as %s", ssid.c_str());
            }
        - globals.set:
            id: boot_complete
            value: 'true'

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  flash_size: 4MB
  framework:
    type: arduino

logger:
  baud_rate: 115200
  level: DEBUG

debug:

api:
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: 'smartrv'
    on_begin:
      then:
        - globals.set:
            id: ota_active
            value: 'true'
    on_end:
      then:
        - globals.set:
            id: ota_active
            value: 'false'
    on_error:
      then:
        - globals.set:
            id: ota_active
            value: 'false'

wifi:
  id: wifi_main
  ap:
    ssid: "TankPro-Setup"
    password: "changeme"
  on_connect:
    - globals.set:
        id: wifi_ever_connected
        value: 'true'

captive_portal:

improv_serial:

web_server:
  port: 80

globals:
  # Persistent configuration (retained across reboots)
  - id: fill_stop_level
    type: float
    restore_value: true
    initial_value: '${default_fill_stop_level}'
  - id: drain_stop_level
    type: float
    restore_value: true
    initial_value: '${default_drain_stop_level}'
  - id: drain_timeout_ms
    type: uint32_t
    restore_value: true
    initial_value: '${default_drain_timeout_ms}'
  - id: safety_override
    type: bool
    restore_value: true
    initial_value: '${default_safety_override}'
  - id: valve_override
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: freeze_protection_enabled
    type: bool
    restore_value: true
    initial_value: '${default_freeze_protection_enabled}'
  - id: freeze_protection_threshold_c
    type: float
    restore_value: true
    initial_value: '${default_freeze_threshold_c}'
  - id: level_empty_volts
    type: float
    restore_value: true
    initial_value: '${default_level_empty_volts}'
  - id: level_full_volts
    type: float
    restore_value: true
    initial_value: '${default_level_full_volts}'
  - id: tank_role
    type: int
    restore_value: true
    initial_value: '0'
  - id: paired_to_cyd
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: cyd_identifier
    type: std::string
    restore_value: true
    initial_value: '""'
  - id: firmware_version
    type: std::string
    restore_value: true
    initial_value: '"${firmware_version}"'

  # Runtime state (cleared on boot)
  - id: fill_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: drain_in_progress
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: drain_start_level
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: drain_last_level
    type: float
    restore_value: false
    initial_value: '0.0'
  - id: drain_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: drain_last_change_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: fault_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: fault_code_int
    type: int
    restore_value: false
    initial_value: '0'
  - id: last_temp_update_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: temp_timeout_ms
    type: uint32_t
    restore_value: true
    initial_value: '300000'
  - id: fill_above_stop_seen
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: guard_over_stop_counter
    type: int
    restore_value: false
    initial_value: '0'
  - id: pairing_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pairing_token
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: pairing_start_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: boot_complete
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: wifi_ever_connected
    type: bool
    restore_value: true
    initial_value: 'false'
  - id: ota_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: pair_button_press_ms
    type: uint32_t
    restore_value: false
    initial_value: '0'
  - id: reset_warning_active
    type: bool
    restore_value: false
    initial_value: 'false'
  - id: net_flash_steps
    type: int
    restore_value: false
    initial_value: '0'
  - id: pairing_cancel_press
    type: bool
    restore_value: false
    initial_value: 'false'

light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO6
    chipset: ws2812
    num_leds: 1
    rgb_order: grb
    rmt_channel: 0
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
  - platform: esp32_rmt_led_strip
    id: status_led_2
    internal: true
    pin: GPIO7
    chipset: ws2812
    num_leds: 1
    rgb_order: grb
    rmt_channel: 1
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF

script:
  - id: status_led_flash_red
    then:
      - repeat:
          count: 3
          then:
            - light.turn_on:
                id: status_led_2
                brightness: 60%
                red: 100%
                green: 0%
                blue: 0%
            - delay: 300ms
            - light.turn_off: status_led_2
            - delay: 200ms
  - id: pair_button_hold_monitor
    mode: restart
    then:
      - lambda: |-
          id(pair_button_press_ms) = millis();
          id(pairing_cancel_press) = false;
      - if:
          condition:
            lambda: 'return id(pairing_active);'
          then:
            - logger.log: "Pairing button pressed: cancelling pairing mode."
            - globals.set:
                id: pairing_active
                value: 'false'
            - globals.set:
                id: pairing_token
                value: '0'
            - globals.set:
                id: pairing_cancel_press
                value: 'true'
          else:
            - delay: 3s
            - if:
                condition:
                  lambda: 'return id(pair_button).state;'
                then:
                  - script.execute: enter_pairing_mode
            - while:
                condition:
                  lambda: |-
                    if (!id(pair_button).state) return false;
                    return (millis() - id(pair_button_press_ms)) < 15000;
                then:
                  - if:
                      condition:
                        lambda: 'return (millis() - id(pair_button_press_ms)) >= 10000;'
                      then:
                        - globals.set:
                            id: pairing_active
                            value: 'false'
                        - globals.set:
                            id: pairing_token
                            value: '0'
                        - globals.set:
                            id: reset_warning_active
                            value: 'true'
                        - light.turn_on:
                            id: status_led
                            red: 100%
                            green: 0%
                            blue: 0%
                            brightness: 70%
                        - light.turn_off: status_led
                        - light.turn_on:
                            id: status_led_2
                            red: 100%
                            green: 0%
                            blue: 0%
                            brightness: 70%
                        - light.turn_off: status_led_2
                  - delay: 500ms
            - lambda: |-
                const uint32_t held = millis() - id(pair_button_press_ms);
                if (held >= 15000 && id(pair_button).state) {
                  id(factory_reset_script).execute();
                }
            - globals.set:
                id: reset_warning_active
                value: 'false'

  # Main fill automation (self-contained on device)
  - id: fill_tank_script
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(safety_override) || id(fault_active);'
          then:
            - logger.log: "Fill start ignored: safety override or fault active."
          else:
            - globals.set:
                id: fill_in_progress
                value: 'true'
            - globals.set:
                id: fill_above_stop_seen
                value: 'false'
            - switch.turn_on: tank_valve_relay
            - while:
                condition:
                  lambda: |-
                    const float level = id(tank_level).state;
                    const float stop_level = id(fill_stop_level);
                    if (!id(fill_in_progress)) return false;
                    if (isnan(level)) return true;
                    if (level >= stop_level) {
                      if (id(fill_above_stop_seen)) {
                        return false;
                      } else {
                        id(fill_above_stop_seen) = true;
                        return true;
                      }
                    }
                    id(fill_above_stop_seen) = false;
                    return true;
                then:
                  - delay: 3s
            - switch.turn_off: tank_valve_relay
            - globals.set:
                id: fill_in_progress
                value: 'false'
            - globals.set:
                id: fill_above_stop_seen
                value: 'false'

  # Drain automation
  - id: drain_tank_script
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(safety_override) || id(fault_active);'
          then:
            - logger.log: "Drain start ignored: safety override or fault active."
          else:
            - if:
                condition:
                  lambda: 'return id(fill_in_progress);'
                then:
                  - logger.log: "Drain start requested but fill is active; aborting drain."
                else:
                  - globals.set:
                      id: drain_in_progress
                      value: 'true'
                  - lambda: |-
                      id(drain_start_level) = id(tank_level).state;
                      id(drain_last_level) = id(tank_level).state;
                      id(drain_start_ms) = millis();
                      id(drain_last_change_ms) = millis();
                  - switch.turn_on: tank_valve_relay
                  - while:
                      condition:
                        lambda: |-
                          if (!id(drain_in_progress)) return false;
                          const float level = id(tank_level).state;
                          const float stop_level = id(drain_stop_level);
                          const unsigned long now = millis();
                          if (!isnan(level) && !isnan(id(drain_last_level)) && fabs(level - id(drain_last_level)) > 0.5f) {
                            id(drain_last_change_ms) = now;
                            id(drain_last_level) = level;
                          }
                          if (!isnan(level) && level <= stop_level) return false;
                          if (now - id(drain_last_change_ms) >= id(drain_timeout_ms)) return false;
                          return true;
                      then:
                        - delay: 3s
                  - switch.turn_off: tank_valve_relay
                  - globals.set:
                      id: drain_in_progress
                      value: 'false'

  - id: enter_pairing_mode
    then:
      - logger.log: "Entering pairing mode."
      - globals.set:
          id: pairing_active
          value: 'true'
      - lambda: |-
          uint32_t token = esp_random();
          id(pairing_token) = token;
          ESP_LOGI("pairing", "Pairing token generated: %u", token);
      - lambda: 'id(pairing_start_ms) = millis();'

  - id: factory_reset_script
    then:
      - logger.log: "Factory reset starting."
      - globals.set:
          id: level_empty_volts
          value: '${default_level_empty_volts}'
      - globals.set:
          id: level_full_volts
          value: '${default_level_full_volts}'
      - globals.set:
          id: fill_stop_level
          value: '${default_fill_stop_level}'
      - globals.set:
          id: drain_stop_level
          value: '${default_drain_stop_level}'
      - globals.set:
          id: safety_override
          value: '${default_safety_override}'
      - globals.set:
          id: freeze_protection_enabled
          value: '${default_freeze_protection_enabled}'
      - globals.set:
          id: tank_role
          value: '0'
      - globals.set:
          id: paired_to_cyd
          value: 'false'
      - globals.set:
          id: pairing_active
          value: 'false'
      - lambda: 'id(cyd_identifier).clear();'
      - globals.set:
          id: pairing_token
          value: '0'
      - globals.set:
          id: fault_active
          value: 'false'
      - globals.set:
          id: fault_code_int
          value: '0'
      - text_sensor.template.publish:
          id: fault_description
          state: "None"
      - text_sensor.template.publish:
          id: fault_code
          state: "0"
      - logger.log: "Factory reset complete; restarting."
      - button.press: restart_device

  - id: pairing_advert_script
    then:
      - lambda: |-
          std::string ident = id(tankpro_identifier).state;
          std::string mac = id(module_mac_address).state;
          std::string role;
          switch (id(tank_role)) {
            case 1: role = "Fresh"; break;
            case 2: role = "Waste"; break;
            default: role = "Unassigned"; break;
          }
          char buf[256];
          snprintf(buf, sizeof(buf), "{\"type\":\"tank_controller\",\"event\":\"pairing_advert\",\"identifier\":\"%s\",\"mac\":\"%s\",\"role\":\"%s\",\"token\":%u}", ident.c_str(), mac.c_str(), role.c_str(), id(pairing_token));
          ESP_LOGI("pairing", "%s", buf);
          if (WiFi.status() == WL_CONNECTED) {
            const uint16_t port = ${cyd_udp_port};
            WiFiUDP udp;
            udp.begin(0);
            udp.beginPacket(IPAddress(255, 255, 255, 255), port);
            udp.write(reinterpret_cast<const uint8_t *>(buf), strlen(buf));
            udp.endPacket();
            udp.stop();
            ESP_LOGI("pairing", "sent advert (%u bytes)", static_cast<unsigned>(strlen(buf)));
          } else {
            ESP_LOGW("pairing", "WiFi not connected; advert not sent");
          }

  # Pairing accept shims for CYD testing
  - id: pair_accept_fresh
    then:
      - logger.log: "CYD pair accept (Fresh) received."
      - if:
          condition:
            lambda: 'return id(pairing_active);'
          then:
            - globals.set:
                id: tank_role
                value: '1'
            - globals.set:
                id: paired_to_cyd
                value: 'true'
            - globals.set:
                id: pairing_active
                value: 'false'
            - logger.log: "Paired as Fresh. Pairing complete."
          else:
            - logger.log: "Pair accept ignored: pairing not active."

  - id: pair_accept_waste
    then:
      - logger.log: "CYD pair accept (Waste) received."
      - if:
          condition:
            lambda: 'return id(pairing_active);'
          then:
            - globals.set:
                id: tank_role
                value: '2'
            - globals.set:
                id: paired_to_cyd
                value: 'true'
            - globals.set:
                id: pairing_active
                value: 'false'
            - logger.log: "Paired as Waste. Pairing complete."
          else:
            - logger.log: "Pair accept ignored: pairing not active."

interval:
  # Safety guard: close valve if level meets/exceeds stop level regardless of state
  - interval: 2s
    then:
      - if:
          condition:
            lambda: |-
              const float level = id(tank_level).state;
              const bool above = !isnan(level) && level >= id(fill_stop_level);
              if (id(drain_in_progress)) {
                id(guard_over_stop_counter) = 0;
                return false;
              }
              if (above) {
                id(guard_over_stop_counter) += 1;
              } else {
                id(guard_over_stop_counter) = 0;
              }
              return !id(safety_override) && id(tank_valve_relay).state && above && id(guard_over_stop_counter) >= 2;
          then:
            - if:
                condition:
                  lambda: 'return id(fill_in_progress);'
                then:
                  - logger.log: "Safety guard: level at/above stop threshold during fill; closing valve (normal stop)."
                  - switch.turn_off: tank_valve_relay
                  - globals.set:
                      id: fill_in_progress
                      value: 'false'
                  - globals.set:
                      id: drain_in_progress
                      value: 'false'
                  - globals.set:
                      id: guard_over_stop_counter
                      value: '0'
                else:
                  - logger.log: "Safety guard: valve open without fill_in_progress and level at/above stop; closing valve and flagging fault."
                  - switch.turn_off: tank_valve_relay
                  - globals.set:
                      id: fill_in_progress
                      value: 'false'
                  - globals.set:
                      id: drain_in_progress
                      value: 'false'
                  - globals.set:
                      id: fault_active
                      value: 'true'
                  - globals.set:
                      id: fault_code_int
                      value: '2'
                  - globals.set:
                      id: guard_over_stop_counter
                      value: '0'
                  - text_sensor.template.publish:
                      id: fault_description
                      state: "Valve open without active fill"
                  - text_sensor.template.publish:
                      id: fault_code
                      state: "2"
                  - script.execute: status_led_flash_red
  # Fault annunciation: pulse buzzer and LED while in fault state
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(fault_active) && !id(safety_override);'
          then:
            - switch.turn_on: tank_buzzer
            - delay: 300ms
            - switch.turn_off: tank_buzzer
  # Freeze protection / temp sensor health check
  - interval: 5s
    then:
      - if:
          condition:
            lambda: 'return id(freeze_protection_enabled) && !id(safety_override);'
          then:
            - lambda: |-
                const float t = id(tank_temperature).state;
                const bool timed_out = id(last_temp_update_ms) > 0 && (millis() - id(last_temp_update_ms) > id(temp_timeout_ms));
                if (id(fault_active) && id(fault_code_int) != 3 && id(fault_code_int) != 4) {
                  return;
                }
                if (isnan(t) || timed_out) {
                  if (id(fault_code_int) != 4 || !id(fault_active)) {
                    ESP_LOGI("freeze_protect", "Temp sensor failure while freeze protection enabled; setting fault code 4 (nan=%d timed_out=%d).", isnan(t), timed_out);
                    id(fault_active) = true;
                    id(fault_code_int) = 4;
                    id(fill_in_progress) = false;
                    id(drain_in_progress) = false;
                    id(tank_valve_relay).turn_off();
                    id(fault_description).publish_state("Temp Sensor Failure");
                    id(fault_code).publish_state("4");
                    id(status_led_flash_red).execute();
                  }
                  return;
                }
                if (t <= id(freeze_protection_threshold_c)) {
                  if (id(fault_code_int) != 3 || !id(fault_active)) {
                    ESP_LOGI("freeze_protect", "Freeze protection active: temp %.2fC at/below threshold %.2fC.", t, id(freeze_protection_threshold_c));
                    id(fault_active) = true;
                    id(fault_code_int) = 3;
                    id(fill_in_progress) = false;
                    id(drain_in_progress) = false;
                    id(fault_description).publish_state("Freeze protection");
                    id(fault_code).publish_state("3");
                    id(status_led_flash_red).execute();
                  }
                  id(tank_valve_relay).turn_on();
                }
                // If temp is healthy and above threshold, do nothing here; clearing fault handled elsewhere.
  # Pairing timeout
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(pairing_active) && (millis() - id(pairing_start_ms) > 60000);'
          then:
            - logger.log: "Pairing timed out after 60s; deactivating."
            - globals.set:
                id: pairing_active
                value: 'false'
  # Pairing advert broadcast
  - interval: 2s
    then:
      - if:
          condition:
            lambda: 'return id(pairing_active) && !id(paired_to_cyd);'
          then:
            - script.execute: pairing_advert_script
  # Safety: if already paired, force pairing mode off so adverts stop
  - interval: 3s
    then:
      - lambda: |-
          if (id(paired_to_cyd) && id(pairing_active)) {
            static bool logged = false;
            if (!logged) {
              ESP_LOGI("pairing", "Disabling pairing mode because controller is already paired.");
              logged = true;
            }
            id(pairing_active) = false;
            id(pairing_token) = 0;
          }
  # Listen for CYD pairing requests over UDP
  - interval: 100ms
    then:
      - lambda: |-
          if (WiFi.status() != WL_CONNECTED) return;
          static WiFiUDP listener;
          static bool udp_started = false;
          if (!udp_started) {
            if (listener.begin(${cyd_udp_port})) {
              udp_started = true;
            }
          }
          if (!udp_started) return;
          int packet_size = listener.parsePacket();
          while (packet_size > 0) {
            char buf[384] = {0};
            const int len = listener.read(buf, sizeof(buf) - 1);
            if (len > 0) {
              buf[len] = 0;
              #include "ArduinoJson.h"
              StaticJsonDocument<384> doc;
              auto err = deserializeJson(doc, buf);
              if (!err) {
                const char *type = doc["type"] | "";
                const char *event = doc["event"] | "";
                const std::string target_id = doc["id"] | "";
                const std::string my_id = id(tankpro_identifier).state;
                if (strcmp(type, "cyd_pair") == 0 && strcmp(event, "request") == 0 && target_id == my_id) {
                  const char *role_str = doc["role"] | "";
                  const std::string cyd_id = doc["cyd_id"] | "";
                  if (!cyd_id.empty()) {
                    id(cyd_identifier) = cyd_id;
                  }
                  int role = 0;
                  if (strcasecmp(role_str, "Fresh") == 0) role = 1;
                  else if (strcasecmp(role_str, "Waste") == 0) role = 2;
                  if (role == 1 || role == 2) {
