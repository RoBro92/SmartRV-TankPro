          const float level_out = isnan(level) ? -1.0f : level;
          const float temp_out = isnan(temp) ? -300.0f : temp;
          char payload[768];
          int written = snprintf(payload, sizeof(payload),
                                 "{\"type\":\"tank_controller\",\"event\":\"state\",\"id\":\"%s\",\"mac\":\"%s\",\"role\":\"%s\","
                                 "\"status\":\"%s\",\"level\":%.1f,\"temp_c\":%.2f,\"leak\":%s,\"freeze_enabled\":%s,"
                                 "\"fill_in_progress\":%s,\"drain_in_progress\":%s,"
                                 "\"fault_active\":%s,\"fault_code\":%d,\"fault_description\":\"%s\","
                                 "\"valve_override\":%s,"
                                 "\"paired\":%s,\"wifi_signal_dbm\":%d,\"uptime_s\":%lu,"
                                 "\"version\":\"%s\",\"ip\":\"%s\"}",
                                 ident.c_str(), mac.c_str(), role,
                                 status, level_out, temp_out,
                                 leak ? "true" : "false", freeze_enabled ? "true" : "false",
                                 id(fill_in_progress) ? "true" : "false", id(drain_in_progress) ? "true" : "false",
                                 id(fault_active) ? "true" : "false", id(fault_code_int), fault_desc.c_str(),
                                 valve_override ? "true" : "false",
                                 id(paired_to_cyd) ? "true" : "false", signal_dbm, (unsigned long) uptime_s,
                                 version.c_str(),
                                 WiFi.localIP().toString().c_str());
          if (written < 0) {
            ESP_LOGW("state", "Failed to format state payload");
            return;
          }
          if (written >= static_cast<int>(sizeof(payload))) {
            ESP_LOGW("state", "State payload truncated (%d >= %u)", written, static_cast<unsigned>(sizeof(payload)));
          }
          const size_t send_len = strnlen(payload, sizeof(payload));
          WiFiUDP udp;
          udp.begin(0);
          udp.beginPacket(IPAddress(255, 255, 255, 255), port);
          udp.write(reinterpret_cast<const uint8_t *>(payload), send_len);
          udp.endPacket();
          udp.stop();

one_wire:
  - platform: gpio
    pin: GPIO1
    id: tank_temp_bus

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO10
      mode: INPUT_PULLUP
      inverted: true
    id: pair_button
    name: "Pair Button"
    on_press:
      - script.execute: pair_button_hold_monitor
    on_release:
      - script.stop: pair_button_hold_monitor
      - globals.set:
          id: reset_warning_active
          value: 'false'
      - lambda: |-
          const uint32_t held = millis() - id(pair_button_press_ms);
          if (!id(fault_active) && !id(reset_warning_active) && !id(pairing_active) && !id(pairing_cancel_press) && held < 1000) {
            id(tank_valve_relay).toggle();
          }
      - globals.set:
          id: pairing_cancel_press
          value: 'false'
      - if:
          condition:
            lambda: 'return id(fault_active);'
          then:
            - button.press: clear_faults_button

  - platform: status
    name: "Status"

  - platform: gpio
    pin:
      number: GPIO3
      mode: INPUT_PULLUP
      inverted: true
    id: leak_sensor
    name: "Leak Sensor"
    device_class: moisture
    on_press:
      - if:
          condition:
            lambda: 'return !id(safety_override);'
          then:
            - logger.log: "Leak detected: triggering critical fault and shutting down valve."
            - globals.set:
                id: fault_active
                value: 'true'
            - globals.set:
                id: fault_code_int
                value: '1'
            - globals.set:
                id: fill_in_progress
                value: 'false'
            - globals.set:
                id: drain_in_progress
                value: 'false'
            - switch.turn_off: tank_valve_relay
            - text_sensor.template.publish:
                id: fault_description
                state: "Leak detected"
            - text_sensor.template.publish:
                id: fault_code
                state: "1"
            - script.execute: status_led_flash_red

sensor:
  - platform: adc
    id: tank_level_voltage
    pin: GPIO0
    name: "Tank Level Voltage"
    update_interval: 2s
    attenuation: 0db
    unit_of_measurement: "V"
    icon: "mdi:water"
    internal: true

  - platform: template
    id: tank_level
    name: "Tank Level"
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:water"
    update_interval: 2s
    lambda: |-
      const float volts = id(tank_level_voltage).state;
      const float empty_v = id(level_empty_volts);
      const float full_v = id(level_full_volts);
      if (isnan(volts) || full_v <= empty_v) return NAN;
      float pct = (volts - empty_v) * 100.0f / (full_v - empty_v);
      if (pct < 0) pct = 0;
      if (pct > 100) pct = 100;
      return pct;

  - platform: dallas_temp
    one_wire_id: tank_temp_bus
    id: tank_temperature
    name: "Tank Temperature"
    filters:
      - lambda: |-
          if (isnan(x)) return NAN;
          if (x == 85.0f || x == 0.0f || x < -55.0f || x > 125.0f) return NAN;
          return x;
    on_value:
      then:
        - lambda: 'id(last_temp_update_ms) = millis();'
        - lambda: |-
            static float last_logged = NAN;
            if (isnan(last_logged) || fabs(x - last_logged) >= 0.1f) {
              last_logged = x;
              ESP_LOGI("temp", "Tank temperature: %.2f C", x);
            }

  - platform: wifi_signal
    id: wifi_signal_dbm
    name: "WiFi Signal"
    update_interval: 60s

  - platform: uptime
    id: uptime_sensor
    name: "Uptime"
    update_interval: 60s

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "Module IP"
    ssid:
      name: "Connected SSID"
    bssid:
      name: "Connected BSSID"
    mac_address:
      name: "Module MAC"
      id: module_mac_address
  - platform: template
    id: fault_description
    name: "Fault Description"
    update_interval: never
    icon: "mdi:alert-circle-outline"
    entity_category: diagnostic
    internal: false
  - platform: template
    id: fault_code
    name: "Fault Code"
    entity_category: diagnostic
    lambda: |-
      char buf[8];
      snprintf(buf, sizeof(buf), "%d", id(fault_code_int));
      return std::string(buf);
    update_interval: 3s
  - platform: template
    id: system_status
    name: "Status"
    icon: "mdi:information"
    lambda: |-
      if (id(pairing_active)) return std::string("Pairing");
      if (id(fault_active)) return std::string("Fault");
      if (id(fill_in_progress)) return std::string("Fill");
      if (id(drain_in_progress)) return std::string("Drain");
      return std::string("OK");
    update_interval: 3s
  - platform: template
    id: firmware_version_text
    name: "Firmware Version"
    entity_category: diagnostic
    lambda: |-
      return id(firmware_version);
    update_interval: never
  - platform: template
    id: wifi_status_text
    name: "WiFi Status"
    entity_category: diagnostic
    icon: "mdi:wifi"
    lambda: |-
      if (WiFi.status() == WL_CONNECTED) {
        return std::string("Connected");
      }
      return std::string("Disconnected");
    update_interval: 5s
  - platform: template
    id: cyd_pair_status
    name: "CYD Link Status"
    entity_category: diagnostic
    icon: "mdi:link-variant"
    lambda: |-
      if (id(paired_to_cyd)) return std::string("Connected");
      if (id(pairing_active)) return std::string("Pairing");
      return std::string("Unassigned");
    update_interval: 5s
  - platform: template
    id: cyd_identifier_text
    name: "Paired CYD ID"
    entity_category: diagnostic
    icon: "mdi:identifier"
    lambda: |-
      if (!id(paired_to_cyd) || id(cyd_identifier).empty()) return std::string("");
      return id(cyd_identifier);
    update_interval: 10s
  - platform: template
    id: tank_role_name
    name: "Tank Role Name"
    icon: "mdi:water"
    entity_category: diagnostic
    internal: false
    lambda: |-
      switch (id(tank_role)) {
        case 1: return std::string("Fresh");
        case 2: return std::string("Waste");
        default: return std::string("Unassigned");
      }
    update_interval: 10s
  - platform: template
    id: tankpro_identifier
    name: "TankPro Identifier"
    entity_category: diagnostic
    internal: false
    lambda: |-
      std::string mac = id(module_mac_address).state;
      std::string compact;
      compact.reserve(mac.size());
      for (char c : mac) {
        if (c != ':') compact.push_back(c);
      }
      const std::string suffix = compact.size() >= 4 ? compact.substr(compact.size() - 4) : compact;
      return std::string("TankPro-") + suffix;
    update_interval: 10s
  - platform: template
    id: freeze_protection_state
    name: "Freeze Protection State"
    icon: "mdi:snowflake-check"
    entity_category: diagnostic
    lambda: |-
      return id(freeze_protection_enabled) ? std::string("Enabled") : std::string("Disabled");
    update_interval: 10s

number:
  - platform: template
    id: fill_stop_level_number
    name: "Fill Stop Level"
    entity_category: config
    unit_of_measurement: "%"
    icon: "mdi:water-check"
    min_value: 0
    max_value: 100
    step: 1
    lambda: 'return id(fill_stop_level);'
    set_action:
      - globals.set:
          id: fill_stop_level
          value: !lambda 'return (float) x;'
  - platform: template
    id: freeze_protection_threshold_number
    name: "Freeze Protection Threshold"
    entity_category: config
    unit_of_measurement: "C"
    icon: "mdi:snowflake"
    min_value: 0.1
    max_value: 5
    step: 0.1
    lambda: 'return id(freeze_protection_threshold_c);'
    set_action:
      - globals.set:
          id: freeze_protection_threshold_c
          value: !lambda 'return (float) x;'
  - platform: template
    id: drain_stop_level_number
    name: "Drain Stop Level"
    entity_category: config
    unit_of_measurement: "%"
    icon: "mdi:water-remove"
    min_value: 0
    max_value: 100
    step: 1
    lambda: 'return id(drain_stop_level);'
    set_action:
      - globals.set:
          id: drain_stop_level
          value: !lambda 'return (float) x;'
  - platform: template
    id: drain_timeout_seconds
    name: "Drain Timeout"
    entity_category: config
    unit_of_measurement: "s"
    icon: "mdi:timer-off"
    min_value: 5
    max_value: 300
    step: 5
    lambda: 'return (float) id(drain_timeout_ms) / 1000.0f;'
    set_action:
      - globals.set:
          id: drain_timeout_ms
          value: !lambda 'return (uint32_t)(x * 1000.0f);'

select:
  - platform: template
    id: tank_role_select
    name: "Tank Role"
    entity_category: config
    options:
      - "Unassigned"
      - "Fresh"
      - "Waste"
    lambda: |-
      switch (id(tank_role)) {
        case 1: return std::string("Fresh");
        case 2: return std::string("Waste");
        default: return std::string("Unassigned");
      }
    set_action:
      - lambda: |-
          int value = 0;
          if (x == "Fresh") {
            value = 1;
          } else if (x == "Waste") {
            value = 2;
          }
          id(tank_role) = value;

switch:
  - platform: gpio
    id: tank_valve_relay
    pin: GPIO5
    name: "Valve Override"
    icon: "mdi:valve"
    restore_mode: ALWAYS_OFF

  - platform: gpio
    id: tank_buzzer
    internal: true
    pin: GPIO4
    restore_mode: ALWAYS_OFF
  - platform: template
    id: freeze_protection_switch
    name: "Freeze Protection"
    icon: "mdi:snowflake-alert"
    entity_category: config
    optimistic: false
    lambda: 'return id(freeze_protection_enabled);'
    turn_on_action:
      - logger.log: "Freeze protection enabled."
      - globals.set:
          id: freeze_protection_enabled
          value: 'true'
    turn_off_action:
      - logger.log: "Freeze protection disabled."
      - globals.set:
          id: freeze_protection_enabled
          value: 'false'
  - platform: template
    id: safety_override_switch
    name: "Safety Override"
    icon: "mdi:shield-off"
    entity_category: config
    optimistic: false
    lambda: 'return id(safety_override);'
    turn_on_action:
      - logger.log: "Safety override enabled: fault triggers and automations disabled."
      - globals.set:
          id: safety_override
          value: 'true'
      - globals.set:
          id: fault_active
          value: 'false'
      - globals.set:
          id: fault_code_int
          value: '0'
      - text_sensor.template.publish:
          id: fault_description
          state: "Override active"
      - text_sensor.template.publish:
          id: fault_code
          state: "0"
    turn_off_action:
      - logger.log: "Safety override disabled: normal monitoring resumed."
      - globals.set:
          id: safety_override
          value: 'false'
      - globals.set:
          id: fault_active
          value: 'false'
      - globals.set:
          id: fault_code_int
          value: '0'
      - text_sensor.template.publish:
          id: fault_description
          state: "None"
      - text_sensor.template.publish:
          id: fault_code
          state: "0"

button:
  - platform: restart
    id: restart_device
    name: "Restart Device"
  - platform: template
    name: "Set Level Empty"
    icon: "mdi:water-minus"
    entity_category: config
    on_press:
      - globals.set:
          id: level_empty_volts
          value: !lambda 'return (float) id(tank_level_voltage).state;'
      - logger.log:
          format: "Saved empty calibration: %.3f V"
          args: ["id(tank_level_voltage).state"]
  - platform: template
    name: "Set Level Full"
    icon: "mdi:water-plus"
    entity_category: config
    on_press:
      - globals.set:
          id: level_full_volts
          value: !lambda 'return (float) id(tank_level_voltage).state;'
      - logger.log:
          format: "Saved full calibration: %.3f V"
          args: ["id(tank_level_voltage).state"]
  - platform: template
    name: "Reset Configuration"
    icon: "mdi:backup-restore"
    entity_category: config
    on_press:
      - logger.log: "Resetting configuration to defaults."
      - globals.set:
          id: level_empty_volts
          value: '${default_level_empty_volts}'
      - globals.set:
          id: level_full_volts
          value: '${default_level_full_volts}'
      - globals.set:
          id: fill_stop_level
          value: '${default_fill_stop_level}'
      - globals.set:
          id: drain_stop_level
          value: '${default_drain_stop_level}'
      - globals.set:
          id: drain_timeout_ms
          value: '${default_drain_timeout_ms}'
      - globals.set:
          id: freeze_protection_threshold_c
          value: '${default_freeze_threshold_c}'
      - globals.set:
          id: freeze_protection_enabled
          value: '${default_freeze_protection_enabled}'
      - globals.set:
          id: safety_override
          value: '${default_safety_override}'
      - globals.set:
          id: fill_in_progress
          value: 'false'
      - globals.set:
          id: drain_in_progress
          value: 'false'
      - globals.set:
          id: fill_above_stop_seen
          value: 'false'
      - globals.set:
          id: guard_over_stop_counter
          value: '0'
      - globals.set:
          id: fault_active
          value: 'false'
      - globals.set:
          id: fault_code_int
          value: '0'
      - switch.turn_off: tank_valve_relay
      - switch.turn_off: tank_buzzer
      - light.turn_off: status_led_2
      - text_sensor.template.publish:
          id: fault_description
          state: "None"
      - text_sensor.template.publish:
          id: fault_code
          state: "0"
  - platform: template
    name: "Start Pairing"
    icon: "mdi:link"
    entity_category: config
    on_press:
      - script.execute: enter_pairing_mode
  - platform: template
    name: "Fill Tank"
    icon: "mdi:water-plus"
    on_press:
      - if:
          condition:
            lambda: 'return id(fault_active) || id(safety_override);'
          then:
            - logger.log: "Fill request ignored: fault or safety override active."
          else:
            - if:
                condition:
                  lambda: 'return id(fill_in_progress);'
                then:
                  - logger.log: "Fill button pressed while running: stopping fill."
                  - globals.set:
                      id: fill_in_progress
                      value: 'false'
                  - switch.turn_off: tank_valve_relay
                else:
                  - if:
                      condition:
                        lambda: 'return !isnan(id(tank_level).state) && id(tank_level).state >= id(fill_stop_level);'
                      then:
                        - logger.log: "Fill button pressed: tank already at/above stop level."
                      else:
                        - logger.log: "Fill button pressed: starting fill."
                        - script.execute: fill_tank_script
  - platform: template
    name: "Drain Tank"
    icon: "mdi:water-remove"
    on_press:
      - if:
          condition:
            lambda: 'return id(fault_active) || id(safety_override);'
          then:
            - logger.log: "Drain request ignored: fault or safety override active."
          else:
            - if:
                condition:
                  lambda: 'return id(drain_in_progress);'
                then:
                  - logger.log: "Drain button pressed while draining: stopping drain."
                  - globals.set:
                      id: drain_in_progress
                      value: 'false'
                  - switch.turn_off: tank_valve_relay
                else:
                  - logger.log: "Drain button pressed: starting drain."
                  - script.execute: drain_tank_script
  - platform: template
    id: clear_faults_button
    name: "Clear Faults"
    icon: "mdi:alert-circle-check"
    on_press:
      - if:
          condition:
            lambda: 'return id(fault_code_int) == 0;'
          then:
            - logger.log: "Clear Faults pressed with no active fault; ignoring."
          else:
            - logger.log: "Clearing faults and resetting state."
            - globals.set:
                id: fault_active
                value: 'false'
            - globals.set:
                id: fault_code_int
                value: '0'
            - globals.set:
                id: fill_in_progress
                value: 'false'
            - globals.set:
                id: drain_in_progress
                value: 'false'
            - switch.turn_off: tank_valve_relay
            - switch.turn_off: tank_buzzer
            - text_sensor.template.publish:
                id: fault_description
                state: "None"
            - text_sensor.template.publish:
                id: fault_code
                state: "0"
