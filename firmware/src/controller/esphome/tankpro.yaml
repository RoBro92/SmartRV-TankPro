  # LED state machine (boot, normal, relay, warning, critical fault, OTA)
  - interval: 200ms
    then:
      - lambda: |-
          auto set_led = [&](light::LightState *led, float r, float g, float b, float brightness) {
            if (led == nullptr) return;
            auto call = led->turn_on();
            call.set_rgb(r, g, b);
            call.set_brightness(brightness);
            call.perform();
          };
          auto off_led = [&](light::LightState *led) {
            if (led == nullptr) return;
            led->turn_off().perform();
          };

          // Blink phases
          static bool fast_phase = false;
          static uint8_t fast_counter = 0;   // toggle every tick (5 Hz)
          fast_phase = !fast_phase;
          static bool slow_phase = false;
          static uint8_t slow_counter = 0;   // toggle every 1s
          slow_counter = (slow_counter + 1) % 5;
          if (slow_counter == 0) slow_phase = !slow_phase;

          // Breathing brightness
          static float breath = 0.3f;
          static bool breath_rising = true;
          const float breath_step = 0.05f;
          if (breath_rising) {
            breath += breath_step;
            if (breath >= 0.9f) breath_rising = false;
          } else {
            breath -= breath_step;
            if (breath <= 0.2f) breath_rising = true;
          }

          const bool booting = !id(boot_complete);
          const bool ota = id(ota_active);
          const bool fault = id(fault_active);
          const int fault_code = id(fault_code_int);
          const bool warning = fault && fault_code == 4;  // temp sensor issue considered non-critical
          const bool relay_on = id(tank_valve_relay).state;
          const bool pairing_mode = id(pairing_active);
          const bool reset_warn = id(reset_warning_active);

          // LED1 (network/link status)
          const wl_status_t wifi_status = WiFi.status();
          const bool wifi_up = wifi_status == WL_CONNECTED;
          const bool wifi_connecting = wifi_status == WL_DISCONNECTED || wifi_status == WL_IDLE_STATUS;
          const bool wifi_failed = wifi_status == WL_CONNECT_FAILED || wifi_status == WL_NO_SSID_AVAIL;
          const bool ever_connected = id(wifi_ever_connected);
          const bool connection_lost = ever_connected && !wifi_up;
          const bool captive_wait = !ever_connected && !wifi_up;
          const bool direct_connected = WiFi.getMode() == WIFI_AP || WiFi.softAPgetStationNum() > 0;

          // Detect connectivity state changes to blink LED1 yellow twice
          static bool prev_wifi = false;
          static bool prev_cyd = false;
          static bool prev_direct = false;
          if (wifi_up != prev_wifi || id(paired_to_cyd) != prev_cyd || direct_connected != prev_direct) {
            id(net_flash_steps) = 4;  // two flashes (on/off/on/off)
          }
          prev_wifi = wifi_up;
          prev_cyd = id(paired_to_cyd);
          prev_direct = direct_connected;

          if (booting) {
            off_led(id(status_led));
          } else if (pairing_mode) {
            if (fast_phase) set_led(id(status_led), 1.0f, 1.0f, 1.0f, 0.8f);  // white
            else set_led(id(status_led), 0.0f, 0.0f, 1.0f, 0.8f);  // blue
          } else if (ota) {
            if (slow_phase) set_led(id(status_led), 1.0f, 0.0f, 1.0f, 0.7f); // purple slow flash
            else off_led(id(status_led));
          } else if (wifi_up || id(paired_to_cyd)) {
            set_led(id(status_led), 0.0f, 0.0f, 1.0f, 0.7f);  // blue solid
          } else if (captive_wait) {
            if (slow_phase) set_led(id(status_led), 1.0f, 1.0f, 1.0f, 0.8f); // white slow flash
            else off_led(id(status_led));
          } else if (wifi_connecting) {
            if (fast_phase) set_led(id(status_led), 0.0f, 0.0f, 1.0f, 0.7f); // blue fast flash
            else off_led(id(status_led));
          } else if (connection_lost || wifi_failed) {
            if (slow_phase) set_led(id(status_led), 1.0f, 1.0f, 0.0f, 0.8f); // yellow slow flash
            else off_led(id(status_led));
          } else {
            set_led(id(status_led), 1.0f, 0.0f, 0.0f, 0.7f); // red solid
          }

          if (ota) {
            if (fast_phase) {
              set_led(id(status_led_2), 1.0f, 0.0f, 1.0f, 0.8f);   // purple fast flash
            } else {
              off_led(id(status_led_2));
            }
            return;
          }

          if (booting) {
            if (slow_phase) {
              set_led(id(status_led_2), 1.0f, 0.8f, 0.6f, 0.8f);   // warm white pulse
            } else {
              off_led(id(status_led_2));
            }
            return;
          }

          if (reset_warn) {
            if (fast_phase) {
              set_led(id(status_led), 1.0f, 0.0f, 0.0f, 0.8f);
              off_led(id(status_led_2));
            } else {
              off_led(id(status_led));
              set_led(id(status_led_2), 1.0f, 0.0f, 0.0f, 0.8f);
            }
            return;
          }

          if (fault) {
            if (fast_phase) {
              set_led(id(status_led), 1.0f, 0.0f, 0.0f, 0.8f);
              off_led(id(status_led_2));
            } else {
              off_led(id(status_led));
              set_led(id(status_led_2), 1.0f, 0.0f, 0.0f, 0.8f);
            }
            return;
          }

          if (booting) {
            off_led(id(status_led));
          } else if (id(net_flash_steps) > 0) {
            const bool on_phase = (id(net_flash_steps) % 2) == 0;
            if (on_phase) set_led(id(status_led), 1.0f, 1.0f, 0.0f, 0.8f); // yellow flash
            else off_led(id(status_led));
            id(net_flash_steps) -= 1;
          }

          if (relay_on) {
            set_led(id(status_led_2), 1.0f, 1.0f, 0.0f, 0.6f);
          } else {
            set_led(id(status_led_2), 0.0f, 1.0f, 0.0f, 0.6f);
          }
  # Controller state broadcast for CYD
  - interval: 2s
    then:
      - lambda: |-
          if (WiFi.status() != WL_CONNECTED) return;
